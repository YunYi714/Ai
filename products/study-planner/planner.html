<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><style>
@page{size:A4;margin:0}
*{box-sizing:border-box}
body{margin:0;font-family:"WenQuanYi Zen Hei",sans-serif;color:#2b2b2b}
.page{width:210mm;height:297mm;padding:16mm 15mm;page-break-after:always;position:relative}
h1{font-size:22pt;margin:0 0 4mm;color:#3d5a80;letter-spacing:1px}
h2{font-size:12pt;margin:5mm 0 2mm;color:#3d5a80}
.sub{color:#888;font-size:9pt;margin-bottom:5mm}
.line{border-bottom:1px solid #cfd8e3;height:8mm}
table{width:100%;border-collapse:collapse;font-size:9pt}
td,th{border:1px solid #cfd8e3;padding:1.5mm;vertical-align:top}
th{background:#e8eef5;color:#3d5a80;font-weight:normal}
.box{border:1.5px solid #98c1d9;border-radius:3mm;padding:3mm;margin-bottom:3mm}
.foot{position:absolute;bottom:8mm;left:0;right:0;text-align:center;font-size:7pt;color:#aaa}
.cover{display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(160deg,#e0fbfc,#98c1d9)}
.cover h1{font-size:40pt}
.chk{display:inline-block;width:3.5mm;height:3.5mm;border:1px solid #98c1d9;margin-right:2mm;vertical-align:middle}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
.dot{background-image:radial-gradient(#cfd8e3 1px,transparent 1px);background-size:5mm 5mm}
</style></head><body>
<div id="root"></div>
<script>
const R=document.getElementById('root');const foot='<div class="foot">讀書計畫手帳 · 個人使用授權，請勿轉售</div>';
const lines=n=>Array(n).fill('<div class="line"></div>').join('');
const add=h=>R.insertAdjacentHTML('beforeend',`<div class="page">${h}${foot}</div>`);
// cover
R.insertAdjacentHTML('beforeend',`<div class="page cover"><h1>讀書計畫手帳</h1><div style="font-size:14pt;color:#3d5a80">Study Planner · 可重複列印</div><div style="margin-top:20mm;font-size:11pt">姓名＿＿＿＿＿＿＿＿　目標＿＿＿＿＿＿＿＿</div></div>`);
// how to use
add(`<h1>使用說明</h1><div class="sub">從大目標拆到每一天</div>
<div class="box"><b>1. 目標設定頁</b>：寫下考試／學期目標與理由，想放棄時回來看。</div>
<div class="box"><b>2. 考試倒數＋科目規劃</b>：列出每科範圍與弱點，排定複習順序。</div>
<div class="box"><b>3. 月計畫</b>：每月初填，標出考試、截止日。</div>
<div class="box"><b>4. 週計畫</b>：每週日晚上花 10 分鐘填。</div>
<div class="box"><b>5. 每日頁＋番茄鐘</b>：每天最重要 3 件事，一個番茄 = 25 分鐘專注。</div>
<div class="box"><b>6. 習慣追蹤</b>：連續打勾很有成就感。</div>
<div class="box"><b>7. 錯題本</b>：記錯因，比記答案重要。</div>
<div class="box"><b>8. 讀書時數統計</b>：每週回顧，調整計畫。</div>
<p style="font-size:9pt;color:#666">建議列印方式：A4 單面或雙面皆可；週計畫、每日頁可多印幾份。也可匯入 GoodNotes / Notability 用平板手寫。</p>`);
// goals
add(`<h1>我的目標</h1><h2>最終目標</h2>${lines(2)}<h2>為什麼想達成？</h2>${lines(4)}
<h2>階段目標</h2><table><tr><th style="width:22%">期限</th><th>要達成什麼</th><th style="width:12%">完成</th></tr>${Array(6).fill('<tr><td style="height:11mm"></td><td></td><td></td></tr>').join('')}</table>
<h2>給未來的自己</h2><div class="box dot" style="height:45mm"></div>`);
// subjects
add(`<h1>考試倒數＆科目規劃</h1><div class="box" style="font-size:12pt">考試名稱＿＿＿＿＿＿＿＿　日期＿＿＿＿＿＿　剩餘＿＿＿＿天</div>
<table><tr><th style="width:15%">科目</th><th>範圍</th><th style="width:22%">弱點</th><th style="width:12%">自評/10</th><th style="width:12%">目標分</th></tr>${Array(8).fill('<tr><td style="height:20mm"></td><td></td><td></td><td></td><td></td></tr>').join('')}</table>`);
// month
const days=['一','二','三','四','五','六','日'];
add(`<h1>月計畫</h1><div class="sub">＿＿＿＿年＿＿＿月　　本月重點：＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿</div>
<table><tr>${days.map(d=>`<th>${d}</th>`).join('')}</tr>${Array(6).fill('<tr>'+Array(7).fill('<td style="height:30mm"></td>').join('')+'</tr>').join('')}</table>
<h2>本月檢討</h2>${lines(3)}`);
// week
add(`<h1>週計畫</h1><div class="sub">＿＿月＿＿日 ～ ＿＿月＿＿日　　本週目標：＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿</div>
<div class="grid2">${days.map(d=>`<div class="box" style="height:40mm;margin:0"><b>星期${d}</b><br>${Array(4).fill('<span class="chk"></span>＿＿＿＿＿＿＿＿＿＿＿<br>').join('')}</div>`).join('')}<div class="box" style="height:40mm;margin:0"><b>本週回顧</b><br>做得好：<br><br>要改進：</div></div>`);
// daily
add(`<h1>每日計畫</h1><div class="sub">＿＿月＿＿日（＿）　　今天心情：☺ ☹ 😐　　睡眠＿＿小時</div>
<h2>今天最重要的 3 件事</h2>${[1,2,3].map(i=>`<div class="line"><span class="chk"></span>${i}.</div>`).join('')}
<div class="grid2" style="margin-top:4mm"><div><h2>時間表</h2><table>${Array.from({length:16},(_,i)=>`<tr><td style="width:18%;height:8.5mm">${i+7}:00</td><td></td></tr>`).join('')}</table></div>
<div><h2>番茄鐘（每格 25 分）</h2><div style="font-size:16pt;letter-spacing:3mm;line-height:12mm">${'○'.repeat(16).replace(/(.{4})/g,'$1<br>')}</div><h2>其他待辦</h2>${Array(6).fill('<div class="line"><span class="chk"></span></div>').join('')}<h2>今日一句話</h2>${lines(2)}</div></div>`);
// habit
add(`<h1>習慣追蹤</h1><div class="sub">＿＿＿＿年＿＿＿月</div><table style="font-size:7pt"><tr><th style="width:22%">習慣</th>${Array.from({length:31},(_,i)=>`<th style="padding:0.5mm">${i+1}</th>`).join('')}</tr>
${['早起','背單字','運動','不滑手機讀書1小時','喝水2000ml','','','','','','',''].map(h=>`<tr><td style="height:11mm;font-size:9pt">${h}</td>${'<td></td>'.repeat(31)}</tr>`).join('')}</table>`);
// mistakes
add(`<h1>錯題本</h1><div class="sub">科目＿＿＿＿＿＿</div>${Array(4).fill(`<div class="box" style="height:58mm"><table style="border:none"><tr><td style="border:none;width:50%">題目／出處：</td><td style="border:none">錯誤原因：<span class="chk"></span>觀念 <span class="chk"></span>粗心 <span class="chk"></span>沒看過 <span class="chk"></span>時間不夠</td></tr></table><div style="margin-top:22mm">正確觀念：</div></div>`).join('')}`);
// hours
add(`<h1>讀書時數統計</h1><div class="sub">一格 = 30 分鐘，用不同顏色代表科目</div>
<table><tr><th style="width:14%">週</th>${days.map(d=>`<th>${d}</th>`).join('')}<th style="width:10%">總計</th></tr>${Array(12).fill('<tr><td style="height:15mm"></td>'+'<td></td>'.repeat(8)+'</tr>').join('')}</table>
<h2>科目顏色</h2>${lines(2)}`);
</script></body></html>
